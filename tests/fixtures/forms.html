<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Elements Capabilities Test Fixture</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f9f9f9; }
        section { margin-bottom: 40px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: white; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .field-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; }
        .inline-group { display: flex; align-items: center; gap: 10px; }
        .inline-group input { margin: 0; }
        .error-text { color: red; font-size: 12px; display: none; }
        .success-text { color: green; font-size: 12px; display: none; }
    </style>
</head>
<body>
    <h1>Form Elements Capabilities Test Fixture</h1>

    <!-- 1. Text-based Inputs -->
    <section id="text-inputs-section">
        <h2 id="text-inputs-title">1. Text-based Inputs</h2>
        
        <div class="field-group">
            <label for="text-single">Single-line Text</label>
            <input type="text" id="text-single" placeholder="Enter text here...">
        </div>

        <div class="field-group">
            <label for="text-password">Password Field</label>
            <input type="password" id="text-password" placeholder="Enter password...">
        </div>

        <div class="field-group">
            <label for="text-email">Email Field</label>
            <input type="email" id="text-email" placeholder="email@example.com">
        </div>

        <div class="field-group">
            <label for="text-number">Number Field</label>
            <input type="number" id="text-number" value="10" min="0" max="100">
        </div>

        <div class="field-group">
            <label for="text-tel">Telephone Field</label>
            <input type="tel" id="text-tel" placeholder="+1 234 567 890">
        </div>

        <div class="field-group">
            <label for="text-url">URL Field</label>
            <input type="url" id="text-url" placeholder="https://example.com">
        </div>

        <div class="field-group">
            <label for="text-textarea">Multi-line Text (Textarea)</label>
            <textarea id="text-textarea" rows="4" placeholder="Enter long text..."></textarea>
        </div>

        <div class="field-group">
            <label for="text-search">Search Field</label>
            <input type="search" id="text-search" placeholder="Search...">
        </div>
    </section>

    <!-- 2. Checkboxes -->
    <section id="checkboxes-section">
        <h2 id="checkboxes-title">2. Checkboxes</h2>
        
        <div class="field-group">
            <label>Preferences</label>
            <div class="inline-group">
                <input type="checkbox" id="check-newsletter" name="pref" value="newsletter">
                <label for="check-newsletter">Subscribe to newsletter</label>
            </div>
            <div class="inline-group">
                <input type="checkbox" id="check-terms" name="pref" value="terms">
                <label for="check-terms">Accept terms and conditions</label>
            </div>
            <div class="inline-group">
                <input type="checkbox" id="check-hidden" name="pref" value="hidden" style="display:none;">
                <label for="check-hidden">Hidden Checkbox (should not be interactable)</label>
            </div>
            <div class="inline-group">
                <input type="checkbox" id="check-disabled" name="pref" value="disabled" disabled>
                <label for="check-disabled">Disabled Checkbox</label>
            </div>
        </div>
    </section>

    <!-- 3. Radio Buttons -->
    <section id="radios-section">
        <h2 id="radios-title">3. Radio Buttons</h2>
        
        <div class="field-group">
            <label>Payment Method</label>
            <div class="inline-group">
                <input type="radio" id="radio-credit" name="payment" value="credit">
                <label for="radio-credit">Credit Card</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-paypal" name="payment" value="paypal">
                <label for="radio-paypal">PayPal</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-bank" name="payment" value="bank">
                <label for="radio-bank">Bank Transfer</label>
            </div>
        </div>

        <div class="field-group">
            <label>Gender</label>
            <div class="inline-group">
                <input type="radio" id="radio-male" name="gender" value="male">
                <label for="radio-male">Male</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-female" name="gender" value="female">
                <label for="radio-female">Female</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-other" name="gender" value="other">
                <label for="radio-other">Other</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-disabled" name="gender" value="disabled" disabled>
                <label for="radio-disabled">Disabled Radio</label>
            </div>
        </div>
    </section>

    <!-- 4. Special Inputs -->
    <section id="special-inputs-section">
        <h2 id="special-inputs-title">4. Special Inputs</h2>
        
        <div class="field-group">
            <label for="input-date">Date Picker</label>
            <input type="date" id="input-date">
        </div>

        <div class="field-group">
            <label for="input-color">Color Picker</label>
            <input type="color" id="input-color" value="#ff0000">
        </div>

        <div class="field-group">
            <label for="input-range">Range Slider</label>
            <input type="range" id="input-range" min="0" max="100" value="50">
        </div>
    </section>

    <!-- 5. Form Validation & State -->
    <section id="validation-section">
        <h2 id="validation-title">5. Form Validation & State</h2>
        
        <div class="field-group">
            <label for="val-required">Required Field (HTML5)</label>
            <input type="text" id="val-required" required placeholder="This field is required">
            <span id="err-required" class="error-text">This field is required!</span>
        </div>

        <div class="field-group">
            <label for="val-email">Email Validation (HTML5)</label>
            <input type="email" id="val-email" required placeholder="Enter a valid email">
            <span id="err-email" class="error-text">Please enter a valid email address.</span>
        </div>

        <div class="field-group">
            <label for="val-disabled">Disabled Field</label>
            <input type="text" id="val-disabled" disabled value="Cannot edit this">
        </div>

        <div class="field-group">
            <label for="val-readonly">Read-only Field</label>
            <input type="text" id="val-readonly" readonly value="Read only content">
        </div>
    </section>

    <div style="margin-top: 40px; text-align: center;">
        <button id="submit-form" style="padding: 10px 20px; cursor: pointer;">Submit Form</button>
        <p id="form-status" style="margin-top: 10px;"></p>
    </div>

    <script>
        document.getElementById('submit-form').addEventListener('click', () => {
            const status = document.getElementById('form-status');
            const requiredField = document.getElementById('val-required');
            
            if (requiredField.value === '') {
                document.getElementById('err-required').style.display = 'block';
                status.textContent = 'Form submission failed: Required field missing.';
                status.style.color = 'red';
            } else {
                document.getElementById('err-required').style.display = 'none';
                status.textContent = 'Form submitted successfully!';
                status.style.color = 'green';
            }
        });
    </script>
</body>
</html>
