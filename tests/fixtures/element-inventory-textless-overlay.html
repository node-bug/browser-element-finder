<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Element Inventory Text-less Overlay Fixture</title>
  <style>
    /* A pure-container overlay: no id, no aria-label, no own text.
       This is the most common real-world modal pattern. */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <!-- Regular page content -->
  <h1 id="page-title">Page Title</h1>
  <button id="open-modal-btn">Open Modal</button>

  <!-- Text-less overlay container: no id, no aria-label, no own text.
       It wraps several identifiable children. The dominant-overlay logic
       should detect this as the overlay with the most descendants. -->
  <div class="modal-backdrop">
    <div role="dialog" aria-modal="true">
      <h2>Modal Heading</h2>
      <p>Some modal content here.</p>
      <button id="modal-confirm">Confirm</button>
      <button id="modal-cancel">Cancel</button>
    </div>
  </div>
</body>
</html>
