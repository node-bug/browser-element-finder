<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncovered Lines Test Fixture</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; }
        th { background-color: #f0f0f0; }
        .shadow-container { margin: 20px 0; padding: 10px; border: 1px dashed #999; }
        iframe { width: 100%; height: 200px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Uncovered Lines Test Fixture</h1>

    <!-- 1. Shadow DOM Test -->
    <section id="shadow-section">
        <h2>Shadow DOM Tests</h2>
        <div class="shadow-container">
            <div id="shadow-host">Shadow Host</div>
        </div>
    </section>

    <!-- 2. SELECT with Option Text Matching -->
    <section id="select-section">
        <h2>SELECT Option Text Matching</h2>
        <div class="field-group">
            <label for="fruit-select">Choose a fruit:</label>
            <select id="fruit-select">
                <option value="opt-apple">Opt-Fruit-Apple</option>
                <option value="opt-banana">Opt-Fruit-Banana</option>
                <option value="opt-cherry">Opt-Fruit-Cherry</option>
                <option value="opt-date">Opt-Fruit-Date</option>
            </select>
        </div>
    </section>

    <!-- 3. Table with Header Cells for Column Expansion -->
    <section id="table-section">
        <h2>Table Column Expansion</h2>
        <table id="test-table">
            <thead>
                <tr>
                    <th id="name-header">Name</th>
                    <th id="value-header">Value</th>
                    <th id="status-header">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alice</td>
                    <td>100</td>
                    <td>Active</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>200</td>
                    <td>Inactive</td>
                </tr>
            </tbody>
        </table>
    </section>

    <!-- 4. Ancestor XPath Test -->
    <section id="ancestor-section">
        <h2>Ancestor XPath Tests</h2>
        <div class="ancestor-container" data-testid="ancestor-container">
            <div class="parent-div">
                <span class="target-span">Target for ancestor</span>
            </div>
        </div>
    </section>

    <!-- 5. Iframe -->
    <section id="iframe-section">
        <h2>Iframe Tests</h2>
        <iframe id="test-iframe" src="about:blank"></iframe>
    </section>

    <script>
        // Create shadow DOM
        const shadowHost = document.getElementById('shadow-host');
        const shadowRoot = shadowHost.attachShadow({ mode: 'open' });
        shadowRoot.innerHTML = `
            <div class="shadow-content">
                <span class="shadow-text">Shadow DOM Text</span>
                <button class="shadow-button">Shadow Button</button>
            </div>
        `;

        // Setup iframe content
        document.addEventListener('DOMContentLoaded', () => {
            const iframe = document.getElementById('test-iframe');
            const doc = iframe.contentDocument || iframe.contentWindow.document;
            doc.open();
            doc.write(`
                <!DOCTYPE html>
                <html>
                <head><title>Iframe Content</title></head>
                <body>
                    <div id="iframe-content">Iframe Element</div>
                    <button id="iframe-button">Iframe Button</button>
                </body>
                </html>
            `);
            doc.close();
        });
    </script>
</body>
</html>
