<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Overlay Elements Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .overlay-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000;
        }
        .modal-dialog {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 20px; border-radius: 8px; z-index: 1001;
        }
        .cookie-banner {
            position: sticky; bottom: 0; left: 0; width: 100%;
            background: #333; color: white; padding: 15px; z-index: 9999;
        }
        .toast-notification {
            position: fixed; top: 20px; right: 20px;
            background: green; color: white; padding: 10px; z-index: 2000;
        }
        .regular-content { margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Regular content (should NOT be detected as overlay) -->
    <div class="regular-content">
        <h1>Overlay Test Page</h1>
        <p>This is regular page content.</p>
        <button id="open-modal-btn">Open Modal</button>
    </div>

    <!-- 1. ARIA dialog role -->
    <div id="aria-dialog" role="dialog" aria-modal="true" class="modal-dialog">
        <h2>Aria Dialog</h2>
        <p>This is an ARIA modal dialog.</p>
        <button id="aria-dialog-close">Close</button>
    </div>

    <!-- 2. Native <dialog> element -->
    <dialog id="native-dialog" open>
        <h2>Native Dialog</h2>
        <p>This is a native HTML dialog.</p>
        <button id="native-dialog-close">Close</button>
    </dialog>

    <!-- 3. Cookie consent banner (sticky + class pattern) -->
    <div id="cookie-banner" class="cookie-banner">
        <p>We use cookies. <button id="accept-cookies">Accept All</button></p>
    </div>

    <!-- 4. Toast notification (fixed + high z-index) -->
    <div id="toast" class="toast-notification">
        <span>Action completed successfully!</span>
    </div>

    <!-- 5. Popover API element -->
    <div id="popover-element" popover>
        <h3>Popover Content</h3>
        <p>This uses the Popover API.</p>
    </div>

    <!-- 6. Alert dialog role -->
    <div id="alert-dialog" role="alertdialog" aria-modal="true">
        <h2>Alert Dialog</h2>
        <p>Are you sure?</p>
        <button id="alert-confirm">Yes</button>
        <button id="alert-cancel">No</button>
    </div>

    <!-- 7. Backdrop (fixed + high z-index, no overlay class — should still match) -->
    <div id="backdrop" class="overlay-backdrop"></div>
</body>
</html>
